[package]
name = "pathweft-rars"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rars = { git = "https://github.com/bitplane/rars", rev = "e2415a2eb12e6b62deaa0cca919864eabe4671b1", default-features = false, features = ["write", "encryption"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
