[package]
name = "pathweft-rars"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
rars = { git = "https://github.com/bitplane/rars", rev = "f7098c7b9a1e844555daad1d376fd1f043adba2c", default-features = false, features = ["write", "encryption", "recovery"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
